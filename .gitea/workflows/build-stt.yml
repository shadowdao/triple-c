name: Build STT Container

on:
  push:
    branches: [main]
    paths:
      - "stt-container/**"
      - ".gitea/workflows/build-stt.yml"
  pull_request:
    branches: [main]
    paths:
      - "stt-container/**"
      - ".gitea/workflows/build-stt.yml"
  # Dispatched by build-app.yml when a release is cut, with the release's tag.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build as :latest (default: the newest vX.Y.Z)"
        required: false

env:
  REGISTRY: repo.anhonesthost.net
  IMAGE_NAME: cybercovellc/triple-c/triple-c-stt

jobs:
  build-stt-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # **`:latest` is what installed apps pull, so only a release moves it.**
      # A push to main publishes `:edge` and `:<sha>` (for testing a merged
      # image by hand); a pull request publishes nothing. The weekly rebuild
      # and a release dispatch build a release tag and publish it as `:latest`
      # — the tag, not main, so unreleased container changes never reach users.
      - name: Pick the source and the tags to publish
        id: src
        env:
          EVENT: ${{ gitea.event_name }}
          RELEASE_TAG: ${{ gitea.event.inputs.release_tag }}
          REF: ${{ gitea.ref }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push|pull_request)
              CHANNEL=edge
              ;;
            schedule|workflow_dispatch)
              CHANNEL=latest
              # `:latest` reaches every user, so it only comes from main: a
              # dispatch from another branch, or a tag cut on one, is refused.
              # An older release tag is allowed on purpose — that is a rollback.
              if [ "$REF" != "refs/heads/main" ]; then
                echo "Refusing to publish :latest from $REF (only main)" >&2
                exit 1
              fi
              git fetch --tags --force
              git fetch origin main
              if [ -z "${RELEASE_TAG:-}" ]; then
                RELEASE_TAG=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
              fi
              if ! echo "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "Not a release tag: '$RELEASE_TAG'" >&2
                exit 1
              fi
              if ! git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" FETCH_HEAD; then
                echo "$RELEASE_TAG is not on main; refusing to publish it as :latest" >&2
                exit 1
              fi
              git checkout --detach "refs/tags/$RELEASE_TAG"
              echo "Building release $RELEASE_TAG"
              ;;
            *)
              echo "Unexpected event $EVENT" >&2
              exit 1
              ;;
          esac
          SHA=$(git rev-parse HEAD)
          {
            echo "tags<<EOF"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$CHANNEL"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$SHA"
            echo "ghcr.io/shadowdao/triple-c-stt:$CHANNEL"
            echo "ghcr.io/shadowdao/triple-c-stt:$SHA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: shadowdao
          password: ${{ secrets.GH_PAT }}

      - name: Build and push STT container image
        uses: docker/build-push-action@v5
        with:
          context: ./stt-container
          file: ./stt-container/Dockerfile
          platforms: linux/amd64,linux/arm64
          # A pull_request run only validates; see the tag step for what each
          # other event publishes.
          push: ${{ gitea.event_name != 'pull_request' }}
          tags: ${{ steps.src.outputs.tags }}
          # The gha cache is served by the runner that picks the job up, and
          # is unreachable from the job on some of ours (the home box's
          # firewalled per-job bridge; ephemeral runners). Import failures
          # only warn, but an export failure fails the build unless told not
          # to -- the same setting build.yml already carries.
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
