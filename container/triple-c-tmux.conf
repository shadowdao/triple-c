# /etc/triple-c/tmux.conf — the tmux every persistent AWS terminal runs in.
#
# The app (host/persistent.rs) starts one tmux *server* per terminal tab,
# `tmux -L triple-c-<session id> -f /etc/triple-c/tmux.conf new-session -A …`,
# so the tab's Claude Code or shell outlives the app closing or the SSM tunnel
# dropping, and the app re-attaches to it on its next connect. tmux is only the
# keeper of the process here, never a UI: the person in front of xterm.js must
# not be able to tell it is there. Hence every setting below.
#
# Lives outside /home/claude (seed-only, see CLAUDE.md) so an image update
# reaches it. The app probes for this file (and tmux) before using it; an image
# without them runs terminals the old way.

# No prefix key at all: Ctrl+B is readline's backward-char and Claude Code's
# own binding, and nothing here is driven from the keyboard.
set -g prefix None
set -g prefix2 None
unbind-key C-b

# No status line: the app's tab strip is the status line.
set -g status off

# An ESC must reach Claude Code at once (vi mode, Esc to interrupt), and ESC+CR
# (the app's Shift+Enter, CLAUDE_SOFT_NEWLINE) must arrive as one Meta-Enter.
set -s escape-time 0

# Pane history the app replays into a re-opened tab (capture-pane).
set -g history-limit 50000

# Inside: a terminfo every Ubuntu has (ncurses-base). Outside: xterm.js, which
# speaks 24-bit colour, OSC 8 hyperlinks and OSC 52.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:hyperlinks:clipboard"
set -s set-clipboard on

# Draw in xterm.js's normal screen, not its alternate screen, so scrolled-off
# output lands in the app's own scrollback and its copy cleanup and link
# detection keep working (smcup@/rmcup@). Two more, both measured by feeding
# tmux's real output into xterm.js:
#  * indn@: with it tmux scrolls with CSI S (SU), and xterm.js's SU deletes the
#    top line instead of saving it to scrollback (4 of 300 fast lines kept);
#    without it tmux scrolls with newlines, which xterm.js keeps (all 300).
#  * clear=\E[H: tmux sends `clear` when its client exits, which without an
#    alternate screen wiped the session's last screen (Claude's goodbye, the
#    shell's last output) from the tab. Its full redraws repaint every row
#    anyway (checked: bash `clear`, ED 2, a curses alternate screen, a
#    re-attach over an old screen and Claude Code's TUI all match tmux's own
#    view of the pane).
set -as terminal-overrides ",xterm*:smcup@:rmcup@:indn@:clear=\\E[H"

# The mouse belongs to xterm.js (selection, links, wheel scrollback).
set -g mouse off
set -g focus-events on

# The process is the session: when it exits, the server goes with it (the tab
# shows "[Session ended]"); nothing is kept after a client detaches.
set -g remain-on-exit off
set -g destroy-unattached off
set -g exit-empty on
set -g exit-unattached off

# Follow the size of whichever client attached last (there is normally one).
set -g window-size latest
setw -g aggressive-resize on

# No window/title games behind the app's back.
set -g set-titles off
setw -g automatic-rename off
setw -g allow-rename off
set -g visual-bell off
set -g bell-action none
