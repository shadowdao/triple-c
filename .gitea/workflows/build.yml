name: Build Container

on:
  push:
    branches: [main]
    paths:
      - "container/**"
      - ".gitea/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "container/**"
      - ".gitea/workflows/build.yml"
  # Weekly rebuild with no commit needed, so OS security fixes published since
  # the last push reach the image (see APT_REFRESH in container/Dockerfile).
  # It rebuilds the newest *release*, not main, because it moves `:latest`.
  schedule:
    - cron: "17 4 * * 1"
  # Dispatched by build-app.yml when a release is cut, with the release's tag.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build as :latest (default: the newest vX.Y.Z)"
        required: false

env:
  REGISTRY: repo.anhonesthost.net
  IMAGE_NAME: cybercovellc/triple-c/triple-c-sandbox

jobs:
  build-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # **`:latest` is what installed apps pull, so only a release moves it.**
      # A push to main publishes `:edge` and `:<sha>` (for testing a merged
      # image by hand); a pull request publishes nothing. The weekly rebuild
      # and a release dispatch build a release tag and publish it as `:latest`
      # — the tag, not main, so unreleased container changes never reach users.
      - name: Pick the source and the tags to publish
        id: src
        env:
          EVENT: ${{ gitea.event_name }}
          RELEASE_TAG: ${{ gitea.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push|pull_request)
              CHANNEL=edge
              ;;
            schedule|workflow_dispatch)
              CHANNEL=latest
              git fetch --tags --force
              if [ -z "${RELEASE_TAG:-}" ]; then
                RELEASE_TAG=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
              fi
              if ! echo "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "Not a release tag: '$RELEASE_TAG'" >&2
                exit 1
              fi
              git checkout --detach "refs/tags/$RELEASE_TAG"
              echo "Building release $RELEASE_TAG"
              ;;
            *)
              echo "Unexpected event $EVENT" >&2
              exit 1
              ;;
          esac
          SHA=$(git rev-parse HEAD)
          {
            echo "tags<<EOF"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$CHANNEL"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$SHA"
            echo "ghcr.io/shadowdao/triple-c-sandbox:$CHANNEL"
            echo "ghcr.io/shadowdao/triple-c-sandbox:$SHA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Put BuildKit in the host's network namespace so it can reach
          # act_runner's cache service.
          #
          # The `docker-container` driver — which the multi-arch build below
          # requires, since the plain `docker` driver cannot do
          # linux/amd64+linux/arm64 — runs BuildKit in its *own* container on
          # Docker's default bridge. act_runner advertises ACTIONS_CACHE_URL as
          # an address the *job* container can reach, and nothing teaches the
          # BuildKit container about it: the job could reach
          # 192.168.1.126:40649 while the container actually making the request
          # could not, and the build died with `no route to host`.
          #
          # `no route to host` is EHOSTUNREACH — a firewall rejecting, not a
          # missing route (a wrong address times out instead) — which is what a
          # default firewalld zone does to traffic arriving from the docker
          # bridge. Sharing the host's namespace sidesteps the question
          # entirely: the cache address becomes local to BuildKit.
          #
          # No effect on runners where this already worked.
          driver-opts: network=host

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: shadowdao
          password: ${{ secrets.GH_PAT }}

      # Changes once a week, which invalidates the cached `apt-get upgrade`
      # layer (container/Dockerfile) so later security fixes are picked up.
      - name: Compute the apt refresh stamp
        id: apt
        run: echo "stamp=$(date -u +%G-W%V)" >> $GITHUB_OUTPUT

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: ./container
          file: ./container/Dockerfile
          platforms: linux/amd64,linux/arm64
          # A pull_request run only validates; see the tag step for what each
          # other event publishes.
          push: ${{ gitea.event_name != 'pull_request' }}
          build-args: |
            APT_REFRESH=${{ steps.apt.outputs.stamp }}
          tags: ${{ steps.src.outputs.tags }}
          # `ignore-error` is what stops a cache failure failing a build that
          # already succeeded. act_runner emulates the GitHub Actions cache
          # service on the runner host's LAN address, and the `docker-container`
          # builder `setup-buildx-action` creates could not route to it —
          # every layer of both arches built, then the job died on
          # `GetCacheEntryDownloadURL: no route to host` while exporting.
          #
          # On a pull_request `push:` above is false, so this job pushes
          # nothing and the cache is its only output: failing it discarded a
          # complete, successful validation of the Dockerfile for both
          # architectures. A cache is an optimisation and must degrade to
          # "slow", never to "red".
          #
          # The import is already non-fatal — the build ran all 37 layers after
          # warning that it could not read the cache — so only the exporter
          # needs the flag.
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
